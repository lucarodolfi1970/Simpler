<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Simpler viewport</title>
<style>
  /* (1.78.5) busy in the background: the arrow with the hourglass - the view can still be turned and looked at;
     the full hourglass only when the app is really locked (lockwork) */
  body.working, body.working * { cursor: progress !important; }
  html { background: #0b1220; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif; user-select: none; }
  #view { position: absolute; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
  /* the path-traced picture lies UNDER the 3D canvas: while it is shown the canvas is transparent, with only the
     selection outline drawn on it */
  #cycles { z-index: -1; position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; pointer-events: none; opacity: 0; }
  #cycles.on { opacity: 1; }
  #bottombar { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 8px; align-items: stretch; pointer-events: none; }
  #badge { padding: 6px 10px; border-radius: 8px; background: rgba(10,18,34,.85);
           border: 1px solid #1c2b47; color: #c9d3e4; font: 12px "Cascadia Mono", Consolas, monospace; pointer-events: none; }
  #badge.cycles { color: #f2c877; border-color: #3b3220; }
  body.locked #toolbar, body.locked #viewbar { pointer-events: none; opacity: .5; }
  #badge { position: relative; overflow: hidden; }
  #badge .bar { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: #f2c877; transition: width .3s; }
  #badge:not(.progress):not(.running) .bar { display: none; }
  /* path tracing still refining: a bar that keeps moving (you can work meanwhile); «✓ finito» when it is over */
  #badge.running .bar { width: 30%; transition: none; animation: badgeRun 1.3s linear infinite; }
  @keyframes badgeRun { from { left: -30%; } to { left: 100%; } }
  #badge.error { color: #ff9b8f; border-color: #5a2a26; }
  /* «Nascondi la neve» on: a reminder next to the badge (snowState in viewer.js) */
  #snowHidden { display: none; padding: 6px 10px; border-radius: 8px; background: rgba(10,18,34,.85); border: 1px solid #2d4a6e;
    color: #9fd0ff; font: 12px "Cascadia Mono", Consolas, monospace; pointer-events: none; white-space: nowrap; }
  #snowHidden.on { display: block; }
  /* (1.75.9) SmartView on: an orange reminder - the view is not computed again by itself (setSmartView in viewer.js) */
  #smartView { display: none; padding: 6px 10px; border-radius: 8px; background: rgba(10,18,34,.85); border: 1px solid #6e4a1e;
    color: #f5a85a; font: 12px "Cascadia Mono", Consolas, monospace; pointer-events: none; white-space: nowrap; }
  #smartView.on { display: block; }
  #badge { max-width: 70vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #fps { position: absolute; right: 12px; bottom: 12px; padding: 4px 8px; border-radius: 7px; background: rgba(10,18,34,.72);
         border: 1px solid #1c2b47; color: #8a99b5; font: 11px "Cascadia Mono", Consolas, monospace; pointer-events: none; white-space: nowrap; }
  #fps b { color: #c9d3e4; font-weight: 600; }
  #fps.slow b { color: #f2c14e; } #fps.veryslow b { color: #ff9b8f; }
  #fps.hidden { display: none; }
  /* «Occupato · attendi»: as long as Simpler is working on something you must wait for (busyTick in viewer.js) */
  #busyWarn { position: absolute; right: 12px; bottom: 76px; display: none; flex-direction: column; align-items: flex-end;
    gap: 2px; padding: 7px 12px; border-radius: 8px; background: rgba(120,10,16,.88); border: 1px solid #ff5a5f;
    color: #fff; font: 600 13px/1.25 'Segoe UI', sans-serif; letter-spacing: .02em; pointer-events: none; z-index: 30;
    box-shadow: 0 0 0 0 rgba(255,90,95,.6); animation: busyBlink 1.1s ease-in-out infinite; }
  #busyWarn.on { display: flex; }
  #busyWarn small { font-weight: 400; font-size: 11.5px; color: #ffd9da; letter-spacing: 0; }
  @keyframes busyBlink { 0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(255,90,95,.55); } 50% { opacity: .55; box-shadow: 0 0 0 6px rgba(255,90,95,0); } }
  body.ebusy, body.ebusy * { cursor: progress !important; }
  body.lockwork.ebusy, body.lockwork.ebusy *, body.lockwork.working, body.lockwork.working * { cursor: wait !important; }
  /* (1.75.43) a green notice for a few seconds where the red «Occupato» appears: something finished (an AI video ready) */
  #doneToast { position: absolute; right: 12px; bottom: 76px; display: none; padding: 7px 12px; border-radius: 8px;
    background: rgba(12,92,48,.92); border: 1px solid #4fd18b; color: #fff; font: 600 13px/1.25 'Segoe UI', sans-serif;
    pointer-events: none; z-index: 31; opacity: 0; transition: opacity .35s; }
  #doneToast.on { display: block; }
  /* (1.76.31, Luca) the bench of an ecosystem on: a blue note where «Occupato» appears (that one wins while it shows) */
  #benchNote { position: absolute; right: 12px; bottom: 76px; display: none; max-width: 360px; padding: 8px 12px;
    border-radius: 8px; background: rgba(16,52,110,.92); border: 1px solid #4c9dff; color: #fff;
    font: 600 13px/1.3 'Segoe UI', sans-serif; pointer-events: none; z-index: 29; }
  #benchNote small { display: block; font-weight: 400; font-size: 11.5px; color: #cfe3ff; margin-top: 2px; }
  #benchNote.on { display: block; }
  #benchExit { pointer-events: auto; display: block; margin-top: 8px; padding: 5px 12px; border-radius: 6px; cursor: pointer;
    background: #fff; color: #10346e; border: none; font: 600 12.5px 'Segoe UI', sans-serif; }
  #benchExit:hover { background: #dbe9ff; }
  #busyWarn.on ~ #benchNote, #doneToast.on ~ #benchNote { visibility: hidden; }
  #doneToast.show { opacity: 1; }
  #scale { position: absolute; right: 14px; bottom: 46px; pointer-events: none; display: flex; flex-direction: column; align-items: flex-end;
           font: 600 11px "Cascadia Mono", Consolas, monospace; color: #e4eaf4; text-shadow: 0 0 3px rgba(0,0,0,.9), 0 0 1px #000; }
  #scale .line { height: 6px; border: 2px solid #e4eaf4; border-top: none; box-shadow: 0 1px 2px rgba(0,0,0,.6); margin-top: 2px; }
  #scale.hidden { display: none; }
  #toolbar { position: absolute; left: 12px; top: 12px; display: flex; gap: 2px; padding: 4px; border-radius: 10px;
             background: rgba(10,18,34,.86); border: 1px solid #1c2b47; transition: opacity 150ms; }
  #toolbar.dim button:not(.sel), #toolbar.dim .sep { opacity: .55; }
  #selshape { position: absolute; inset: 0; width: 100%; height: 100%; display: none; pointer-events: none; }
  #selshape path { fill: rgba(76,157,255,.12); stroke: #4c9dff; stroke-width: 1.5; stroke-dasharray: 6 4; }
  #toolbar button { font: 12px "Segoe UI Variable Text", "Segoe UI", sans-serif; color: #c9d3e4; background: transparent; border: 0;
                    padding: 5px 10px; border-radius: 7px; cursor: pointer; }
  #toolbar button:hover:not(:disabled) { background: #16243d; }
  #toolbar button.on { background: #1d3b6b; color: #fff; }
  #toolbar button:disabled { opacity: .4; cursor: default; }
  #toolbar .sep { width: 1px; margin: 4px 4px; background: #24365a; }
  #hud { position: absolute; display: none; pointer-events: none; padding: 5px 9px; border-radius: 7px; white-space: nowrap;
         background: rgba(10,18,34,.92); border: 1px solid #2b3f66; color: #e8eef8; font: 13px "Cascadia Mono", Consolas, monospace; }
  #hud.on { display: block; }
  #hud b.X { color: #ff5c6c; } #hud b.Y { color: #6fdc8c; } #hud b.Z { color: #5b9dff; }
  #hud .snap { color: #f2b54b; font-size: 11px; margin-left: 4px; }
  #viewbar { position: absolute; right: 12px; top: 12px; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 10px;
             background: rgba(10,18,34,.86); border: 1px solid #1c2b47; }
  @media (max-width: 1080px) { #viewbar { top: 56px; } }   /* narrow view: the two bars one under the other */
  #viewbar .lab { font: 12px "Segoe UI Variable Text", "Segoe UI", sans-serif; color: #8a99b5; padding: 0 6px 0 6px; }
  #viewbar button { font: 12px "Segoe UI Variable Text", "Segoe UI", sans-serif; color: #c9d3e4; background: transparent; border: 0;
                    padding: 5px 10px; border-radius: 7px; cursor: pointer; }
  #viewbar button:hover { background: #16243d; }
  #viewbar button.on { background: #1d3b6b; color: #fff; }
  #task { display: none; align-items: center; gap: 10px; padding: 6px 12px; border-radius: 8px; background: rgba(10,18,34,.9);
          border: 1px solid #2b3f66; color: #e4eaf4; font: 12px "Segoe UI Variable Text", "Segoe UI", sans-serif; max-width: 60vw; }
  #task.on { display: flex; }
  #taskBar { width: 140px; height: 5px; border-radius: 3px; background: #1a2842; overflow: hidden; position: relative; flex: none; }
  #taskFill { height: 100%; width: 0; border-radius: 3px; background: #f2b54b; transition: width 120ms; }
  #task.indeterminate #taskFill { width: 30% !important; position: absolute; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { left: -30%; } 100% { left: 100%; } }
  #taskDetail { color: #8a99b5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #taskPct { color: #f2c877; font-family: "Cascadia Mono", Consolas, monospace; }
  #frame { position: absolute; display: none; pointer-events: none; box-shadow: 0 0 0 9999px rgba(5,10,20,.55);
           outline: 1px solid rgba(242,181,75,.8); }
  @keyframes pulse { 50% { transform: scale(.92); opacity: .75; } }
</style>
<script type="importmap">
{ "imports": { "three": "./lib/three.module.js", "three/addons/": "./lib/addons/" } }
</script>
</head>
<body>
<div id="view"></div>
<img id="cycles" alt="">
<div id="frame"></div>
<svg id="selshape"><path d=""></path></svg>
<div id="fps" title=""></div>
<div id="doneToast"></div>
<div id="busyWarn"><span id="busyTitle"></span><small id="busyWhat"></small></div>
<div id="benchNote"><span id="benchTitle"></span><small id="benchWhat"></small><button id="benchExit"></button></div>
<div id="scale" class="hidden"><span class="label"></span><div class="line"></div></div>
<div id="bottombar"><div id="badge">Tempo reale</div><div id="snowHidden"></div><div id="smartView"></div><div id="task"><span id="taskText"></span><div id="taskBar"><div id="taskFill"></div></div><span id="taskPct"></span><span id="taskDetail"></span></div></div>
<div id="toolbar"></div>
<div id="viewbar"></div>
<div id="hud"></div>
<script type="module" src="./viewer.js"></script>
</body>
</html>
